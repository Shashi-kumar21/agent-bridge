[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl-sys", reason = "prefer rustls; no native TLS dependency in this project" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2017-0008", reason = "unmaintained `serial` crate is pulled in by portable-pty 0.8.1; portable-pty 0.9 regresses ConPTY output on Windows, so revisit when upstream fixes the 0.9 line" },
]
