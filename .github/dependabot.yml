version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    target-branch: dev
    ignore:
      # portable-pty 0.9 emits no ConPTY output on Windows, which breaks every
      # agent session. Pinned to =0.8.1 in Cargo.toml and enforced by CI.
      # Remove this ignore only after the smoke test in AGENTS.md section 9
      # passes on a 0.9.x release.
      - dependency-name: "portable-pty"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    target-branch: dev
    ignore:
      # Major action bumps change runner/node requirements; merge them by hand
      # after a green run, never automatically.
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
