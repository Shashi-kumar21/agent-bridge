version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    target-branch: dev

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    target-branch: dev
