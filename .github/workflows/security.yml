name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `rustsec/audit-check` publishes its report through the API of the trigger:
    # a check run on `push`/`workflow_dispatch` (`checks: write`) and an issue
    # per finding on `schedule` (`issues: write`). Without the matching scope the
    # job fails with "Resource not accessible by integration" even when the audit
    # itself is clean.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    name: license + source policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources advisories
